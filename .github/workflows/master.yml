name: Release & Package

on:
  push:
    branches:
      - master
      - beta

# Resolves Node.js version 24 warnings for the entire workflow.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Anti-loop strategy: the release commit used to carry "[skip ci]", but that
# directive kills EVERY workflow for the SHA — including the required
# "PHP Syntax Check" on release PRs, which stalled at "Waiting for status"
# and forced a manual bypass on every release. Now the release commit runs CI
# normally (Smoke Test gives the SHA its green check) and the re-run loop is
# prevented HERE, by skipping these jobs when the pushed commit IS a release
# commit (semantic-release pushes with GH_PAT, which does trigger workflows).
jobs:
  # JOB 1: Update the contributors list in the README
  contrib-readme-job:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          image_size: 80
          use_username: true
          collaborators: all
          auto_detect_branch_protection: false

  # JOB 2: Release & Package
  release:
    # Redundant with the needs-chain (a skipped parent skips the child), but
    # explicit: never run semantic-release on its own release commit.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    needs: contrib-readme-job
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build theme zip
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          mkdir -p staging/reloaded
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='sass' \
            --exclude='node_modules' \
            --exclude='.vscode' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.editorconfig' \
            --exclude='.releaserc' \
            --exclude='staging' \
            --exclude='docs' \
            --exclude='CLAUDE.md' \
            --exclude='tmp' \
            --exclude='tools' \
            --exclude='vendor' \
            --exclude='phpcs.xml.dist' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='CONTRIBUTING.md' \
            ./ staging/reloaded/
          # Minify the theme JS inside the PACKAGE only: the repo stays
          # readable (open source) and the sandbox keeps sources for
          # debugging — only shipped zips carry the minified build. lib/
          # (Prism, Chart.js) is already minified upstream and untouched.
          # A terser parse error fails the step → broken JS can never ship
          # silently.
          for f in staging/reloaded/assets/js/*.js; do
            before=$(wc -c < "$f")
            npx --yes terser@5 "$f" --compress --mangle --comments false -o "$f"
            after=$(wc -c < "$f")
            echo "minified $(basename "$f"): ${before} -> ${after} bytes"
          done
          (cd staging && zip -r ../reloaded.zip reloaded)

      - name: Upload theme zip to release
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: reloaded.zip
          tag_name: v${{ steps.semantic.outputs.new_release_version }}
          token: ${{ secrets.GH_PAT }}
